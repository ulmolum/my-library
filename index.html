<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 서재 · ISBN 스캐너</title>
<style>
body{font-family:system-ui,sans-serif;background:#f5f7fa;color:#1c2938;margin:0;padding:18px}
main{max-width:600px;margin:auto}h1{font-size:24px}.panel{background:white;border-radius:16px;padding:18px;margin:15px 0;box-shadow:0 2px 10px #0001}
video{width:100%;background:#1b2430;border-radius:10px;min-height:200px}
button{background:#2459d3;color:white;border:0;border-radius:9px;padding:12px 15px;font-size:15px;margin:4px 3px 4px 0}
button.secondary{background:#e9edf6;color:#23354b}
input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #c5ccda;border-radius:8px;font-size:16px}
small,.muted{color:#69788b}li{margin:8px 0;overflow-wrap:anywhere}
</style></head><body><main><h1>📚 내 서재</h1><p class="muted">1단계 · ISBN 바코드 인식 테스트</p>
<section class="panel"><video id="preview" playsinline muted autoplay></video>
<p id="status" role="status">카메라 시작을 눌러주세요.</p>
<button id="start">카메라 시작</button><button id="stop" class="secondary">카메라 종료</button>
<p><small>카메라 사용은 HTTPS 또는 localhost에서 가능합니다. Chrome에서 실행하세요.</small></p></section>
<section class="panel"><label for="isbn">ISBN-13</label><input id="isbn" inputmode="numeric" maxlength="17" placeholder="978 또는 979로 시작하는 13자리">
<button id="add">목록에 추가</button><p id="message"></p></section>
<section class="panel"><h2>인식 목록 (<span id="count">0</span>)</h2><ul id="list"></ul>
<button id="csv">CSV 백업</button><button id="clear" class="secondary">전체 삭제</button>
<p><small>1단계에서는 ISBN만 저장하며, CSV는 엑셀에서 열 수 있습니다. 도서 정보 조회 및 XLSX 저장은 다음 단계에서 추가합니다.</small></p></section>
</main>
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const KEY='my-library-isbns-v1';
let items=JSON.parse(localStorage.getItem(KEY)||'[]'),reader=null,controls=null,last='';
function valid(s){if(!/^(978|979)\d{10}$/.test(s))return false;let n=0;for(let i=0;i<12;i++)n+=Number(s[i])*(i%2?3:1);return (10-n%10)%10===Number(s[12]);}
function render(){ $('count').textContent=items.length;$('list').replaceChildren();items.forEach(s=>{let li=document.createElement('li');li.textContent=s+' ';let b=document.createElement('button');b.className='secondary';b.textContent='삭제';b.onclick=()=>{items=items.filter(x=>x!==s);save()};li.append(b);$('list').append(li)})}
function save(){localStorage.setItem(KEY,JSON.stringify(items));render()}
function add(raw){const s=String(raw).replace(/[\s-]/g,'');if(!valid(s)){$('message').textContent='유효한 ISBN-13이 아닙니다.';return}if(items.includes(s)){$('message').textContent='이미 등록된 ISBN입니다.';return}items.push(s);save();$('isbn').value=s;$('message').textContent='등록 완료: '+s}
$('add').onclick=()=>add($('isbn').value);
$('stop').onclick=()=>{controls?.stop();controls=null;$('status').textContent='카메라 종료'};
$('start').onclick=async()=>{if(!window.isSecureContext){$('status').textContent='HTTPS 주소에서 열어주세요.';return}
if(!window.ZXingBrowser){$('status').textContent='스캐너 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.';return}
try{controls?.stop();reader=new ZXingBrowser.BrowserMultiFormatReader();$('status').textContent='카메라를 준비 중입니다…';
controls=await reader.decodeFromConstraints({audio:false,video:{facingMode:{ideal:'environment'}}},$('preview'),(result,error)=>{if(!result)return;const s=result.getText().replace(/[\s-]/g,'');if(s===last)return;if(valid(s)){last=s;add(s);$('status').textContent='인식 성공: '+s;setTimeout(()=>last='',1800)}});$('status').textContent='책 뒷면 ISBN 바코드를 비춰주세요.'}
catch(e){$('status').textContent='카메라 실행 실패: '+e.message}};
$('csv').onclick=()=>{const rows=['ISBN',...items];const blob=new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='내서재_ISBN_'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('clear').onclick=()=>{if(confirm('모든 ISBN을 삭제할까요?')){items=[];save()}};
render();
</script></body></html>
