<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 서재 v0.2</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;color:#182338;margin:0;padding:16px}main{max-width:600px;margin:auto}.card{background:white;padding:16px;border-radius:14px;margin:12px 0}video{width:100%;background:#111;border-radius:9px;max-height:55vh}button{background:#245bd6;color:white;border:0;border-radius:8px;padding:12px;margin:4px 3px 4px 0;font-size:15px}input{padding:11px;width:100%;box-sizing:border-box;font-size:17px}#status,#debug{overflow-wrap:anywhere}small{color:#52647a}</style></head><body><main><h1>📚 내 서재 v0.2</h1><div class="card"><video id="video" playsinline autoplay muted></video><p id="status">카메라 시작을 눌러주세요.</p><p id="debug"><small>인식 대기</small></p><button id="start">카메라 시작</button><button id="stop">카메라 종료</button><p><small>ISBN 숫자가 보이도록 책 뒷면 바코드를 화면 가운데에 맞춰주세요.</small></p></div><div class="card"><label for="isbn">ISBN-13 직접 입력</label><input id="isbn" inputmode="numeric" placeholder="978 또는 979로 시작하는 13자리"><button id="add">목록에 추가</button><p id="msg"></p></div><div class="card"><h2>내 목록 (<span id="count">0</span>)</h2><ul id="list"></ul><button id="csv">CSV 백업</button><button id="clear">목록 삭제</button></div></main><script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script><script>
const $=id=>document.getElementById(id),KEY='my-library-isbns-v1';let items=[];try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}let controls=null,scanner=null,last='',lastAt=0;
function valid(s){if(!/^(978|979)\d{10}$/.test(s))return false;let sum=0;for(let i=0;i<12;i++)sum+=Number(s[i])*(i%2?3:1);return (10-sum%10)%10===Number(s[12]);}
function render(){localStorage.setItem(KEY,JSON.stringify(items));$('count').textContent=items.length;$('list').replaceChildren();items.forEach(s=>{const li=document.createElement('li');li.textContent=s+' ';const b=document.createElement('button');b.textContent='삭제';b.onclick=()=>{items=items.filter(x=>x!==s);render()};li.append(b);$('list').append(li)})}
function add(raw){const s=String(raw).replace(/[^0-9]/g,'');if(!valid(s)){$('msg').textContent='유효한 ISBN-13이 아닙니다: '+s;return false}if(items.includes(s)){$('msg').textContent='이미 등록된 ISBN: '+s;return false}items.push(s);render();$('isbn').value=s;$('msg').textContent='등록 완료: '+s;return true}
$('add').onclick=()=>add($('isbn').value);$('stop').onclick=()=>{controls?.stop();controls=null;$('status').textContent='카메라 종료'};
$('start').onclick=async()=>{if(!window.isSecureContext){$('status').textContent='HTTPS 환경에서 열어주세요.';return}if(!window.ZXingBrowser){$('status').textContent='ZXing 라이브러리 로드 실패. 인터넷 연결을 확인하세요.';return}try{controls?.stop();$('status').textContent='카메라 연결 중…';const ZX=window.ZXingBrowser;scanner=new ZX.BrowserMultiFormatReader();if(typeof scanner.setHints==='function' && window.ZXing?.DecodeHintType){const hints=new Map();hints.set(window.ZXing.DecodeHintType.POSSIBLE_FORMATS,[window.ZXing.BarcodeFormat.EAN_13]);hints.set(window.ZXing.DecodeHintType.TRY_HARDER,true);scanner.setHints(hints)}controls=await scanner.decodeFromConstraints({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}},$('video'),(result,error)=>{if(!result)return;const raw=result.getText();$('debug').textContent='카메라 인식값: '+raw;const s=raw.replace(/\D/g,'');if(s===last&&Date.now()-lastAt<2500)return;last=s;lastAt=Date.now();if(valid(s)){$('status').textContent='ISBN 인식 성공!';add(s)}else{$('status').textContent='바코드가 인식되었지만 ISBN-13이 아닙니다.'}});$('status').textContent='카메라 작동 중 · 바코드를 비춰주세요.'}catch(e){$('status').textContent='실행 오류: '+(e?.message||String(e))}};
$('csv').onclick=()=>{const blob=new Blob(['\ufeffISBN\r\n'+items.join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='내서재_ISBN.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('clear').onclick=()=>{if(confirm('목록을 모두 삭제할까요?')){items=[];render()}};render();
</script></body></html>
