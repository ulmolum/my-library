<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 서재 v0.3</title><style>body{margin:0;background:#f4f6fa;font:16px system-ui,sans-serif;color:#182638}main{max-width:620px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:16px;margin:12px 0}#reader{width:100%;min-height:150px}button{border:0;background:#245bd6;color:white;padding:12px 14px;border-radius:8px;margin:4px;font-size:15px}input[type=text]{width:100%;box-sizing:border-box;padding:12px;font-size:16px}input[type=file]{max-width:100%}#status,#detail{overflow-wrap:anywhere}small{color:#566578}li{margin:8px 0}</style></head><body><main><h1>📚 내 서재 v0.3</h1><section class="card"><h2>바코드 스캔</h2><div id="reader"></div><p id="status" role="status">스캐너 준비 중</p><p id="detail"><small>이번 버전은 html5-qrcode를 사용합니다.</small></p><button id="start">카메라 시작</button><button id="stop">카메라 종료</button><p><b>사진으로 인식하기</b></p><input id="photo" type="file" accept="image/*" capture="environment"><p><small>책 뒷면 바코드가 선명하게 나오도록 촬영하세요. 사진 선택은 카메라가 멈춘 상태에서 사용하세요.</small></p></section><section class="card"><h2>직접 입력</h2><input id="isbn" type="text" inputmode="numeric" placeholder="ISBN 13자리"><button id="add">목록 추가</button><p id="msg"></p></section><section class="card"><h2>저장 목록 (<span id="count">0</span>)</h2><ul id="list"></ul><button id="csv">CSV 백업</button><button id="clear">전체 삭제</button></section></main><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script>
const $=id=>document.getElementById(id),KEY='my-library-isbns-v1';let items=[],scanner=null,running=false,last='';try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){};
function valid(s){if(!/^(978|979)\d{10}$/.test(s))return false;let sum=0;for(let i=0;i<12;i++)sum+=Number(s[i])*(i%2?3:1);return(10-sum%10)%10===Number(s[12])}
function render(){localStorage.setItem(KEY,JSON.stringify(items));$('count').textContent=items.length;$('list').replaceChildren();for(const s of items){const li=document.createElement('li');li.textContent=s+' ';const b=document.createElement('button');b.textContent='삭제';b.onclick=()=>{items=items.filter(x=>x!==s);render()};li.append(b);$('list').append(li)}}
function add(raw){const s=String(raw).replace(/\D/g,'');$('isbn').value=s;if(!valid(s)){$('msg').textContent='ISBN-13 형식 또는 체크숫자가 맞지 않습니다: '+s;return}if(items.includes(s)){$('msg').textContent='이미 등록된 ISBN: '+s;return}items.push(s);render();$('msg').textContent='등록 완료: '+s}
function recognized(raw){$('detail').textContent='감지된 바코드: '+raw;const s=raw.replace(/\D/g,'');if(s===last)return;last=s;setTimeout(()=>last='',2500);if(valid(s)){$('status').textContent='ISBN 인식 성공';add(s)}else $('status').textContent='바코드 감지됨 (ISBN-13 아님)'}
$('add').onclick=()=>add($('isbn').value);
$('start').onclick=async()=>{if(!window.Html5Qrcode){$('status').textContent='스캐너 라이브러리 로드 실패. 인터넷 연결을 확인하세요.';return}if(running)return;try{scanner=scanner||new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A],verbose:false});$('status').textContent='카메라 연결 중…';await scanner.start({facingMode:'environment'},{fps:10,qrbox:undefined,aspectRatio:1.777778},recognized,()=>{});running=true;$('status').textContent='스캔 중 · 바코드를 가로로 비춰주세요.'}catch(e){$('status').textContent='카메라 시작 오류: '+(e.message||e)}};
$('stop').onclick=async()=>{if(running){try{await scanner.stop()}catch(e){}running=false}$('status').textContent='카메라 종료'};
$('photo').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;if(!window.Html5Qrcode){$('status').textContent='라이브러리 로드 실패';return}try{if(running){await scanner.stop();running=false}scanner=scanner||new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A],verbose:false});$('status').textContent='사진 분석 중…';const raw=await scanner.scanFile(f,true);recognized(raw)}catch(err){$('status').textContent='사진에서 바코드를 찾지 못했습니다: '+(err.message||err)}finally{e.target.value=''}};
$('csv').onclick=()=>{const blob=new Blob(['\ufeffISBN\r\n'+items.join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='내서재_ISBN.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('clear').onclick=()=>{if(confirm('모든 ISBN을 삭제할까요?')){items=[];render()}};render();$('status').textContent=window.Html5Qrcode?'준비 완료 · 카메라 시작을 눌러주세요.':'스캐너 라이브러리 로드 실패';
</script></body></html>
